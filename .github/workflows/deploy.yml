name: Deploy Pygame to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg Audio Engine Dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build Web Assets with Pygbag
        run: |
          python -m pip install --upgrade pip
          python -m pip install black pygbag
          python -m pygbag --no_opt --build .

      - name: Houston. We Have Liftoff
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
