name: Lifetime Traffic Tracker

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Fetch and Merge Traffic Data
      env:
        TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
      run: |
        # Initialize an empty history file if it's missing
        if [ ! -f traffic_history.json ]; then
          echo '{"views": {}, "clones": {}}' > traffic_history.json
        fi

        # Pull raw views and clones data
        curl -s -H "Authorization: token $TOKEN" "https://github.com" > incoming_views.json
        curl -s -H "Authorization: token $TOKEN" "https://github.com" > incoming_clones.json

        # Validate that the API response is clean JSON before running jq parsing logic
        if ! jq -e .views incoming_views.json >/dev/null 2>&1; then
          echo "ERROR: GitHub API views request failed. Check your TRAFFIC_TOKEN secret permissions."
          cat incoming_views.json
          exit 1
        fi

        if ! jq -e .clones incoming_clones.json >/dev/null 2>&1; then
          echo "ERROR: GitHub API clones request failed. Check your TRAFFIC_TOKEN secret permissions."
          cat incoming_clones.json
          exit 1
        fi

        # Parse valid responses and merge into the data file
        jq '.views[]? | {key: (.timestamp | .[0:10]), value: {count: .count, uniques: .uniques}}' incoming_views.json | jq -s 'from_entries' > clean_views.json
        jq '.clones[]? | {key: (.timestamp | .[0:10]), value: {count: .count, uniques: .uniques}}' incoming_clones.json | jq -s 'from_entries' > clean_clones.json

        jq --slurpfile nv clean_views.json --slurpfile nc clean_clones.json '.views += $nv[0] | .clones += $nc[0]' traffic_history.json > temporary_history.json
        mv temporary_history.json traffic_history.json

        # Cleanup transient files
        rm incoming_views.json incoming_clones.json clean_views.json clean_clones.json

    - name: Save Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add traffic_history.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update traffic logs [skip ci]" && git push)
